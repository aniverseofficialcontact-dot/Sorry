<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>100 Ways to Say Sorry</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #07091b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none;
        }
        canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="wheelCanvas"></canvas>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');

        const TICK_MS = 16;
        const INTERVAL = 9;
        const R0 = 182;
        const R_MAX = 342;
        const RING = 366;
        const SERIF = "Georgia, serif";
        const SANS = "Helvetica, Arial, sans-serif";

        const BG_TOP = [0.028, 0.035, 0.105];
        const BG_BOT = [0.17, 0.075, 0.19];
        const BGC = [0.06, 0.05, 0.13];
        const CREAM = [1.0, 0.95, 0.88];
        const GOLD = [0.86, 0.69, 0.40];
        const FLASH = [1.0, 0.97, 0.92];

        const STOPS = [
            [0.42, 0.52, 0.98],   // indigo
            [0.68, 0.48, 0.96],   // violet
            [0.96, 0.46, 0.68],   // rose
            [1.00, 0.62, 0.45],   // coral
            [1.00, 0.82, 0.46],   // gold
        ];

        const PHRASES = [
            "I'm so sorry", "I was wrong", "Please forgive me",
            "I take full responsibility", "That was my mistake",
            "I should have listened", "I owe you an apology",
            "I didn't mean to hurt you", "I'm sorry I let you down", "I messed up",
            "I'm truly sorry", "I regret my words", "I was selfish",
            "I should have been there", "I'm sorry for yelling",
            "I'm sorry I wasn't honest", "I was not thinking of you",
            "I handled it badly", "I'm ashamed of how I acted", "You deserved better",
            "I'm sorry I broke my promise", "I'm sorry I forgot",
            "I put my pride first", "I'm sorry I didn't call", "I was unfair to you",
            "I judged too quickly", "I'm sorry I dismissed you",
            "I should have trusted you", "I'm sorry I interrupted", "I wasn't fair",
            "I made it about me", "I'm sorry I was distant",
            "I'm sorry I was late again", "I ignored what you needed",
            "I let my temper win", "I said things I didn't mean",
            "I'm sorry I made you worry", "I didn't see your side",
            "I should have asked first", "I'm sorry I stayed silent",
            "I took you for granted", "I'm sorry I was careless",
            "My words were unkind", "I'm sorry for the silence",
            "I was too proud to say it", "I'm sorry I wasn't listening",
            "I hurt someone I love", "I'm sorry I broke your trust",
            "I should have said it sooner", "I'm sorry it took so long",
            "I'm sorry I made excuses", "No excuses, just sorry",
            "I want to make it right", "Let me make it up to you",
            "I'm here to listen now", "I'll do better, I promise",
            "I'll be more patient", "I'm learning from this",
            "Tell me how to fix it", "I miss you, and I'm sorry",
            "You matter more than winning", "I can't lose you over this",
            "I'm sorry for the hurt", "I'm sorry for the tears",
            "I wish I could undo it", "I'd take it back if I could",
            "I'm sorry for my harsh words", "I was scared and lashed out",
            "I let stress speak for me", "I'm sorry I wasn't kind",
            "You didn't deserve that", "It was never your fault",
            "I'm sorry I blamed you", "I'm sorry I compared us",
            "I'm sorry I overreacted", "I misunderstood you",
            "I wasn't there for you", "I should have shown up",
            "I'm sorry I missed it", "I forgot what mattered",
            "I was busy, not present", "I took it out on you",
            "I'm sorry for the bad timing", "I made you feel small",
            "I'm sorry I wasn't gentle", "I'm sorry I held a grudge",
            "I let it go on too long", "I should have spoken first",
            "I'm sorry I lied", "I'm sorry I hid the truth",
            "You can trust me again", "Give me another chance", "I'm ready to talk",
            "I'm sorry, and I mean it", "I'm sorry from my heart",
            "Forgive me when you can", "I'm grateful for you",
            "I love you, and I'm sorry", "Can we start over?", "I'm sorry. Always.",
        ];

        const N = PHRASES.length;

        function hx(c) {
            const r = Math.max(0, Math.min(255, Math.round(c[0] * 255)));
            const g = Math.max(0, Math.min(255, Math.round(c[1] * 255)));
            const b = Math.max(0, Math.min(255, Math.round(c[2] * 255)));
            return `rgb(${r},${g},${b})`;
        }

        function mix(a, b, k) {
            return [
                a[0] + (b[0] - a[0]) * k,
                a[1] + (b[1] - a[1]) * k,
                a[2] + (b[2] - a[2]) * k
            ];
        }

        function clamp(v) {
            return Math.max(0.0, Math.min(1.0, v));
        }

        function palette(k) {
            k = clamp(k) * (STOPS.length - 1);
            const i = Math.min(Math.floor(k), STOPS.length - 2);
            return mix(STOPS[i], STOPS[i + 1], k - i);
        }

        let seed = 7;
        function random() {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        // Stars setup in logical coords [-600, 600] to cover full screen
        const stars = [];
        for (let i = 0; i < 160; i++) {
            let x = (random() * 1200) - 600;
            let y = (random() * 1200) - 600;
            if (Math.hypot(x, y) < 372) continue;
            let b = 0.15 + random() * 0.35;
            let szChoices = [0.8, 1, 1, 1.4];
            let sz = szChoices[Math.floor(random() * szChoices.length)];
            stars.push({ x, y, sz, b, currentB: b });
        }

        // Spokes setup
        const spokes = [];
        for (let i = 0; i < N; i++) {
            const th = Math.PI / 2 - 2 * Math.PI * i / N;
            spokes.push({
                text: PHRASES[i],
                th: th,
                color: palette(i / (N - 1)),
                born: null
            });
        }

        let width = 0;
        let height = 0;
        let dpr = 1;

        function resize() {
            dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
        }

        window.addEventListener('resize', resize);
        resize();

        let tick = 0;
        let rot = 0.0;
        let rotVelocity = 0.0;
        let shown = 0;
        let cur = null;
        let cur_t = 0;
        let done_t = null;

        // Interactive touch/mouse drag support
        let isDragging = false;
        let lastAngle = 0;

        function getPointerAngle(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const dx = clientX - width / 2;
            const dy = clientY - height / 2;
            return Math.atan2(dy, dx);
        }

        function onPointerDown(e) {
            isDragging = true;
            lastAngle = getPointerAngle(e);
            rotVelocity = 0;
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const currentAngle = getPointerAngle(e);
            let delta = currentAngle - lastAngle;
            if (delta > Math.PI) delta -= Math.PI * 2;
            if (delta < -Math.PI) delta += Math.PI * 2;
            rot -= delta; // Rotate wheel with gesture
            rotVelocity = -delta;
            lastAngle = currentAngle;
        }

        function onPointerUp() {
            isDragging = false;
        }

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp);

        function showCenter(i) {
            cur = i;
            cur_t = tick;
        }

        function wrapText(context, text, maxWidth) {
            const words = text.split(' ');
            const lines = [];
            let currentLine = words[0];

            for (let i = 1; i < words.length; i++) {
                const word = words[i];
                const w = context.measureText(currentLine + " " + word).width;
                if (w < maxWidth) {
                    currentLine += " " + word;
                } else {
                    lines.push(currentLine);
                    currentLine = word;
                }
            }
            lines.push(currentLine);
            return lines;
        }

        function draw() {
            tick++;

            if (!isDragging) {
                const baseSpeed = 0.0006 + (shown >= N ? 0.0006 : 0);
                rotVelocity = rotVelocity * 0.95;
                rot -= (baseSpeed + rotVelocity);
            }

            // Reveal next apology
            if (shown < N && tick % INTERVAL === 0) {
                spokes[shown].born = tick;
                showCenter(shown);
                shown++;
                if (shown === N) {
                    done_t = tick;
                }
            }

            // Keep center phrase changing when complete
            if (done_t && (tick - done_t) > 150 && (tick - cur_t) > 170) {
                let nextChoices = [];
                for (let k = 0; k < N; k++) {
                    if (k !== cur) nextChoices.push(k);
                }
                showCenter(nextChoices[Math.floor(Math.random() * nextChoices.length)]);
            }

            // Twinkle stars
            for (let k = 0; k < 2; k++) {
                const idx = Math.floor(Math.random() * stars.length);
                stars[idx].currentB = stars[idx].b * (0.4 + Math.random() * 0.9);
            }

            // --- RENDER ---
            ctx.save();
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, width, height);

            // Fullscreen Dusk Gradient Background
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, hx(BG_TOP));
            grad.addColorStop(1, hx(BG_BOT));
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Translate to center of screen
            ctx.translate(width / 2, height / 2);

            // Scale wheel dynamically to fit viewport perfectly (Logical canvas = 880x880)
            const minDim = Math.min(width, height);
            const scale = minDim / 880;
            ctx.scale(scale, scale);

            // Draw Stars
            for (let s of stars) {
                ctx.fillStyle = hx(mix(BGC, CREAM, s.currentB));
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.sz, 0, Math.PI * 2);
                ctx.fill();
            }

            // Concentric Rings
            ctx.strokeStyle = hx(mix(BG_TOP, GOLD, 0.35));
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(0, 0, R0 - 14, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = hx(mix(BG_TOP, GOLD, 0.12));
            ctx.beginPath();
            ctx.arc(0, 0, R0 - 19, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = hx(mix(BG_TOP, GOLD, 0.18));
            ctx.beginPath();
            ctx.arc(0, 0, RING, 0, Math.PI * 2);
            ctx.stroke();

            // Progress Arc
            if (shown > 0) {
                ctx.strokeStyle = hx(GOLD);
                ctx.lineWidth = 2;
                ctx.beginPath();
                const extent = (shown / N) * Math.PI * 2;
                ctx.arc(0, 0, RING, -Math.PI / 2, -Math.PI / 2 + extent, false);
                ctx.stroke();
            }

            // Spokes
            ctx.font = `8px ${SANS}`;
            const sweep = (tick * 0.22) % N;

            for (let i = 0; i < N; i++) {
                const p = spokes[i];
                if (p.born === null) continue;

                const u = clamp((tick - p.born) / 40);
                const e = 1 - Math.pow(1 - u, 3);
                const slide = (1 - e) * 18;
                const rr = R0 + slide;

                const a = (p.th + rot) % (Math.PI * 2);
                const x = rr * Math.cos(a);
                const y = -rr * Math.sin(a);

                let glow = 0.0;
                if (done_t) {
                    let d = Math.abs(i - sweep);
                    d = Math.min(d, N - d);
                    glow = Math.exp(-Math.pow(d / 3.0, 2)) * 0.65;
                }

                let pop = u < 0.6 ? 0.9 * Math.sin(Math.PI * clamp((u - 0.1) / 0.5)) : 0;
                const col = mix(mix(BGC, p.color, 0.82 * e), FLASH, Math.max(glow, pop));

                ctx.save();
                ctx.translate(x, y);

                let normA = (a % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);

                if (normA > Math.PI / 2 && normA < 3 * Math.PI / 2) {
                    ctx.rotate(-normA + Math.PI);
                    ctx.textAlign = 'right';
                } else {
                    ctx.rotate(-normA);
                    ctx.textAlign = 'left';
                }

                ctx.fillStyle = hx(col);
                ctx.textBaseline = 'middle';
                ctx.fillText(p.text, 0, 0);
                ctx.restore();
            }

            // Center UI
            const k = clamp((tick - 8) / 40);
            ctx.textAlign = 'center';

            // Title line 1
            ctx.font = `bold 8px ${SANS}`;
            ctx.fillStyle = hx(mix(BGC, GOLD, 0.85 * k));
            ctx.fillText("1 0 0   W A Y S   T O   S A Y", 0, -72);

            // Title line 2
            ctx.fillText("S O R R Y", 0, -56);

            // Rule line
            ctx.strokeStyle = hx(mix(BGC, GOLD, 0.5 * k));
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-26, 52);
            ctx.lineTo(26, 52);
            ctx.stroke();

            // Center Phrase & Counter
            if (cur !== null) {
                const fe = clamp((tick - cur_t) / 14);
                const phraseCol = mix(BGC, mix(CREAM, spokes[cur].color, 0.18), fe);

                ctx.font = `italic 19px ${SERIF}`;
                ctx.fillStyle = hx(phraseCol);
                ctx.textBaseline = 'middle';

                const lines = wrapText(ctx, PHRASES[cur], 250);
                const lineHeight = 24;
                const startY = -2 - ((lines.length - 1) * lineHeight / 2);
                for (let l = 0; l < lines.length; l++) {
                    ctx.fillText(lines[l], 0, startY + l * lineHeight);
                }

                // Counter
                ctx.font = `bold 9px ${SANS}`;
                ctx.fillStyle = hx(mix(BGC, GOLD, 0.75 * fe));
                ctx.fillText(`N° ${String(cur + 1).padStart(3, '0')}`, 0, 72);
            }

            ctx.restore();
            requestAnimationFrame(draw);
        }

        requestAnimationFrame(draw);
    </script>
</body>
</html>
